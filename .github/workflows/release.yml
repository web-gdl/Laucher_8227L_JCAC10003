name: Publicar APK

# Publica una Release con los APK adjuntos cuando cambia el archivo VERSION en main (o al subir una etiqueta v*).
# Para sacar una versión nueva: edita VERSION (p. ej. 3.0.1) y haz push; la etiqueta v3.0.1 se crea sola.
# Enlaces fijos a la última versión:
#   .../releases/latest/download/launcher-prueba.apk
#   .../releases/latest/download/launcher-reemplazo.apk
on:
  push:
    branches: [ main ]
    paths: [ 'VERSION' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar herramientas
        run: ./tools/get-tools.sh

      - name: Compilar las dos variantes
        run: ./build.sh --variant ambas

      - name: Nombrar los archivos y calcular sumas
        run: |
          mkdir -p dist
          cp out/launcher-prueba.apk dist/launcher-prueba.apk
          cp out/launcher-nativo.apk dist/launcher-reemplazo.apk
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Versión
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="$(tr -d ' \n' < VERSION)"; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Launcher nativo v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          body: |
            ## Qué descargar
            - **`launcher-prueba.apk`** — empieza por este. Se instala como una app normal y convive con el launcher de fábrica.
            - **`launcher-reemplazo.apk`** — sustituye al launcher de fábrica (necesita `adb`). Solo para quien sepa revertirlo.

            Guía de instalación y capturas en el [README](https://github.com/${{ github.repository }}#readme).
            Dominio público (Unlicense).
          files: |
            dist/launcher-prueba.apk
            dist/launcher-reemplazo.apk
            dist/SHA256SUMS.txt
