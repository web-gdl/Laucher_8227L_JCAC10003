name: Compilar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pruebas del odómetro y del límite de velocidad
        run: ./test/run.sh

      - name: Descargar herramientas
        run: ./tools/get-tools.sh

      - name: Compilar las dos variantes (normal y reemplazo)
        run: ./build.sh --variant ambas

      - name: Guardar APK principal (convive con el launcher de fábrica)
        uses: actions/upload-artifact@v4
        with:
          name: Laucher-8227L-apk
          path: out/Laucher-8227L.apk
          if-no-files-found: error

      - name: Guardar APK de reemplazo (sustituye al de fábrica)
        uses: actions/upload-artifact@v4
        with:
          name: Laucher-8227L-reemplazo-apk
          path: out/Laucher-8227L-reemplazo.apk
          if-no-files-found: error
