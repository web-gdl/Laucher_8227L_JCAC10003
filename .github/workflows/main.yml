name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer el proyecto
        run: bash launcher-nativo-src.sh

      - name: Descargar herramientas
        working-directory: launcher-nativo
        run: ./tools/get-tools.sh

      - name: Compilar y firmar
        working-directory: launcher-nativo
        run: ./build.sh

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-nativo-apk
          path: launcher-nativo/out/launcher-nativo.apk
