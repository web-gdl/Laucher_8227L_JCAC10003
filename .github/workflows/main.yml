name: Compilar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar herramientas
        run: ./tools/get-tools.sh

      - name: Compilar las dos variantes (prueba y reemplazo)
        run: ./build.sh --variant ambas

      - name: Guardar APK de prueba (convive con el launcher de fábrica)
        uses: actions/upload-artifact@v4
        with:
          name: launcher-PRUEBA-apk
          path: out/launcher-prueba.apk
          if-no-files-found: error

      - name: Guardar APK de reemplazo (sustituye al de fábrica)
        uses: actions/upload-artifact@v4
        with:
          name: launcher-reemplazo-apk
          path: out/launcher-nativo.apk
          if-no-files-found: error
